<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Three connected capabilities. One conversation.</title><desc id="desc">Engage: be there when they ask. Retain: give them a reason to return. Grow: make recommendations count. Illustrative product capabilities.</desc>
<defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="#4ebaff"/><stop offset="1" stop-color="#0088ff"/></linearGradient></defs>
<rect width="1200" height="390" rx="26" fill="#f3f3f3"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0e0a07">
<rect x="20" y="20" width="373" height="350" rx="24" fill="#fff"/>
<rect x="414" y="20" width="373" height="350" rx="24" fill="#fff"/>
<rect x="807" y="20" width="373" height="350" rx="24" fill="#fff"/>
<g font-size="15" font-weight="700" fill="#356b92" letter-spacing="2"><text x="48" y="60">01 / ENGAGE</text><text x="442" y="60">02 / RETAIN</text><text x="835" y="60">03 / GROW</text></g>
<g font-size="29" font-weight="700" letter-spacing="-1"><text x="48" y="106">Be there the</text><text x="48" y="141">moment they ask.</text><text x="442" y="106">Give them a reason</text><text x="442" y="141">to come back.</text><text x="835" y="106">Turn a recommendation</text><text x="835" y="141">into a booking.</text></g>
<rect x="48" y="177" width="249" height="44" rx="16" fill="#f0f0ef"/><text x="63" y="205" font-size="17">Any breakfast options?</text>
<rect x="110" y="235" width="255" height="44" rx="16" fill="url(#b)"/><text x="125" y="263" font-size="17" fill="#fff">Let’s find your favorite.</text>
<rect x="442" y="177" width="317" height="103" rx="18" fill="#eef6fc"/><text x="462" y="208" font-size="16" fill="#356b92">YOUR LOYALTY</text><text x="462" y="243" font-size="28" font-weight="700">One visit to a treat.</text><path d="M463 263h230" stroke="#d1e4f3" stroke-width="5" stroke-linecap="round"/><path d="M463 263h176" stroke="#6aaee2" stroke-width="5" stroke-linecap="round"/>
<rect x="835" y="177" width="317" height="103" rx="18" fill="#eef6fc"/><text x="855" y="208" font-size="16" fill="#356b92">READY TO FORWARD</text><text x="855" y="241" font-size="25" font-weight="700">Give a friend 15% off.</text><text x="855" y="265" font-size="16" fill="#356b92">Earn credit after their qualifying visit.</text>
<g font-size="17" fill="#62605e"><text x="48" y="325">Answers. Feedback. Human help.</text><text x="442" y="325">Rewards. Preferences. Relevant offers.</text><text x="835" y="325">Easy sharing. Verified rewards.</text></g>
</g></svg>
