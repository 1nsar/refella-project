<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Refella — the assistant that actually brings customers back.</title>
<desc id="desc">Sky-blue gradient, Refella's chat logo, and an illustrative conversation about a returning customer. Engage, retain, grow.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#5aa6e0"/><stop offset=".43" stop-color="#9ecbec"/><stop offset="1" stop-color="#f3f3f3"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#4ebaff"/><stop offset="1" stop-color="#0088ff"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#fff" stop-opacity=".65"/></linearGradient>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#214767" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="730" rx="28" fill="url(#sky)"/>
<g font-family="Arial, Helvetica, sans-serif">
 <rect x="511" y="35" width="178" height="53" rx="27" fill="url(#glass)" stroke="#fff" stroke-opacity=".6"/>
 <g transform="translate(530 46)"><rect width="32" height="32" rx="10" fill="#0e0a07"/><path d="M9 22.5V12.5A2.5 2.5 0 0 1 11.5 10h9a2.5 2.5 0 0 1 2.5 2.5V17a2.5 2.5 0 0 1-2.5 2.5H13L9 22.5Z" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round"/></g>
 <text x="573" y="69" font-size="24" font-weight="700" fill="#0e0a07" letter-spacing="-1">Refella</text>
 <text x="600" y="163" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="-2" fill="#fff" fill-opacity=".7">the assistant that actually</text>
 <text x="600" y="222" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="-2.4" fill="#fff">brings customers back.</text>
 <text x="600" y="269" text-anchor="middle" font-size="21" fill="#173e5d">Loyalty and referrals, inside the messaging apps people already use.</text>
 <g filter="url(#soft)">
  <rect x="352" y="310" width="496" height="307" rx="32" fill="#fff" stroke="#e0e6eb"/>
  <path d="M384 310h432a32 32 0 0 1 32 32v30H352v-30a32 32 0 0 1 32-32" fill="#fafafa"/>
  <circle cx="386" cy="341" r="14" fill="#dceeff"/><path d="M380 345v-9h12v7h-8l-4 2" fill="none" stroke="#0088ff" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="411" y="348" font-size="18" font-weight="700" fill="#0e0a07">Your favorite business</text>
  <circle cx="813" cy="342" r="4" fill="#6aaee2"/>
  <rect x="470" y="391" width="351" height="46" rx="17" fill="url(#blue)"/>
  <text x="488" y="420" font-size="18" fill="#fff">A table for two tonight?</text>
  <rect x="379" y="451" width="356" height="67" rx="17" fill="#f0f0ef"/>
  <text x="397" y="478" font-size="18" fill="#0e0a07">19:30 works. The terrace,</text>
  <text x="397" y="502" font-size="18" fill="#0e0a07">like last time?</text>
  <rect x="570" y="532" width="251" height="46" rx="17" fill="url(#blue)"/>
  <text x="588" y="561" font-size="18" fill="#fff">You remembered. Perfect.</text>
 </g>
 <g transform="rotate(-7 198 440)"><rect x="62" y="411" width="255" height="58" rx="20" fill="url(#glass)" stroke="#fff"/><text x="189" y="447" text-anchor="middle" font-size="19" font-weight="700" fill="#23557b">No extra app. Just chat.</text></g>
 <g transform="rotate(6 1003 490)"><rect x="877" y="460" width="260" height="58" rx="20" fill="url(#glass)" stroke="#fff"/><text x="1007" y="496" text-anchor="middle" font-size="19" font-weight="700" fill="#23557b">Good things get shared.</text></g>
 <rect x="390" y="650" width="420" height="43" rx="22" fill="#fff"/>
 <text x="600" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#0e0a07" letter-spacing="1">Engage     /     Retain     /     Grow</text>
</g></svg>
